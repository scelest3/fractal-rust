<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="body" cx="68%" cy="48%" r="55%">
      <stop offset="0%"   stop-color="#ff8040"/>
      <stop offset="45%"  stop-color="#CE422B"/>
      <stop offset="100%" stop-color="#6b1508"/>
    </radialGradient>
    <radialGradient id="bulb" cx="40%" cy="48%" r="60%">
      <stop offset="0%"   stop-color="#ffaa60"/>
      <stop offset="100%" stop-color="#9a1a08"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="5" ry="5" fill="#06060f"/>

  <!-- Mandelbrot silhouette: main cardioid + period-2 bulb -->
  <g filter="url(#glow)">
    <circle cx="13" cy="16" r="3.1" fill="url(#bulb)"/>
    <polygon fill="url(#body)" points="
      27.8,16.0
      28.2,15.8
      29.1,14.8
      29.2,12.6
      27.8,10.1
      24.7,8.4
      20.5,8.8
      17.2,11.6
      16.0,16.0
      17.2,20.4
      20.5,23.2
      24.7,23.6
      27.8,21.9
      29.2,19.4
      29.1,17.2
      28.2,16.2
    "/>
  </g>
</svg>
